name: App CI

on:
  push:
    branches: [main, chore/strengthen-project-workflow]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test appraisal MVP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax and run tests
        run: npm run check
